name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
      - name: Install runtime and browser tests
        run: python -m pip install -r requirements.txt playwright==1.64.1
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Test without private corporate documents
        run: python -m unittest discover -v
