services:
  - type: web
    name: facturacion-telefonica-prodac
    runtime: python
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python -u server.py
    healthCheckPath: /health
    plan: free
    autoDeployTrigger: commit
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
